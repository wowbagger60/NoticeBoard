<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/icons.js"></script>
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("/assets/google_fonts/Poppins-Light.ttf") format("truetype");
            font-weight: 300;
            font-style: normal;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Poppins", sans-serif;
            font-weight: 300;
            letter-spacing: .25px;
        }

        #list {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .item {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr) max-content 34px;
            grid-template-areas: "level message time action";
            align-items: center;
            gap: 10px;
            min-height: 50px;
            margin-left: -8px;
            width: calc(100% + 8px);
            padding: 8px 8px;
            border-radius: 5px;
            transition: background-color .15s;
        }

        .item.has-target { cursor: pointer; }
        .item:hover { background: rgba(128, 128, 128, .10); }

        .item.group-separator {
            margin-top: 7px;
            padding-top: 15px;
            border-top: 1px solid rgba(128, 128, 128, .28);
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        .level {
            grid-area: level;
            width: 18px;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            box-shadow: 0 0 8px color-mix(in srgb, var(--level-color) 52%, transparent);
        }

        .message {
            grid-area: message;
            min-width: 0;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .time {
            grid-area: time;
            white-space: nowrap;
            font-size: .82em;
            opacity: .72;
        }

        .action {
            grid-area: action;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 34px;
            height: 34px;
        }

        .delete {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: inherit;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
        }

        .delete:hover { background: rgba(128, 128, 128, .16); }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100%;
            opacity: .72;
        }

        .empty i { color: #43A047; font-size: 1.35em; }

        @media (max-width: 430px) {
            .item {
                grid-template-columns: max-content minmax(0, 1fr) 34px;
                grid-template-areas:
                    "level message action"
                    "level time action";
                gap: 3px 8px;
            }

            .time { justify-self: start; }
        }
    </style>
</head>
<body>
<div id="list"></div>

<script>
    /*DATA*/

    const params = new URLSearchParams(window.location.search);
    const layout = {
        fontSize: parseFloat(params.get('fontsize') || '14'),
        marginTop: parseFloat(params.get('margintop') || '60'),
        marginSide: parseFloat(params.get('marginside') || '20'),
        marginBottom: parseFloat(params.get('marginbottom') || '15'),
        textColor: '#' + (params.get('textcolor') || '000000'),
        cardColor: '#' + (params.get('cardcolor') || 'ffffff')
    };

    function applyLayout() {
        document.body.style.fontSize = layout.fontSize + 'px';
        document.body.style.color = layout.textColor;
        document.body.style.backgroundColor = layout.cardColor;
        document.body.style.paddingTop = layout.marginTop + 'px';
        document.body.style.paddingRight = layout.marginSide + 'px';
        document.body.style.paddingBottom = layout.marginBottom + 'px';
        document.body.style.paddingLeft = layout.marginSide + 'px';
    }

    function createItem(item) {
        const row = document.createElement('div');
        row.className = 'item';

        if (Number(item.TargetID || 1) > 1) {
            row.classList.add('has-target');
            row.onclick = () => openObject(Number(item.TargetID));
        }

        const level = document.createElement('div');
        level.className = 'level';
        level.title = item.Level;
        level.setAttribute('aria-label', item.Level);
        level.style.setProperty('--level-color', item.Color);
        level.style.backgroundColor = item.Color;

        const message = document.createElement('div');
        message.className = 'message';
        message.textContent = item.Message;

        row.appendChild(level);
        row.appendChild(message);

        if (data.ShowTimestamp) {
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = item.TimestampText;
            row.appendChild(time);
        }

        const action = document.createElement('div');
        action.className = 'action';

        if (item.Deletable) {
            const button = document.createElement('button');
            button.className = 'delete';
            button.type = 'button';
            button.title = translate('Delete message');
            button.setAttribute('aria-label', translate('Delete message'));
            button.innerHTML = '<i class="fa-light fa-trash"></i>';
            button.onclick = event => {
                event.stopPropagation();
                requestAction('DeleteMessage', Number(item.Sequence));
            };
            action.appendChild(button);
        }

        row.appendChild(action);
        return row;
    }

    function render() {
        const list = document.getElementById('list');
        const scrollTop = list.scrollTop;
        list.innerHTML = '';

        if (!Array.isArray(data.Items) || data.Items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = '<i class="fa-light fa-circle-check"></i>';
            const text = document.createElement('span');
            text.textContent = data.EmptyText || '';
            empty.appendChild(text);
            list.appendChild(empty);
            return;
        }

        let previousType = null;

        data.Items.forEach(item => {
            const row = createItem(item);

            if (data.Grouped && previousType !== null && item.Type !== previousType) {
                row.classList.add('group-separator');
            }

            list.appendChild(row);
            previousType = item.Type;
        });
        list.scrollTop = scrollTop;
    }

    function handleMessage(message) {
        try {
            const parsed = typeof message === 'string' ? JSON.parse(message) : message;
            if (parsed && parsed.Type === 'Render' && parsed.Data) {
                data = parsed.Data;
                render();
            }
        } catch (error) {
            // Ignore malformed visualization messages.
        }
    }

    applyLayout();
    render();
    window.addEventListener('load', () => requestAction('Refresh', 0));
</script>
</body>
</html>
